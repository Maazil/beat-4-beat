<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#02182b" />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://api.spotify.com" crossorigin />
    <!-- Fonts are self-hosted (see the @font-face block in src/index.css), so
         nothing render-blocking is fetched cross-origin before text can paint.
         Preloading the two latin subsets used above the fold starts them with
         the document rather than after the stylesheet parses; latin-ext and the
         mono face load on demand from their unicode-range. `crossorigin` is
         required even same-origin — fonts are always fetched in CORS mode. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/bricolage-grotesque-v9-latin.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/schibsted-grotesk-v7-latin.woff2"
      crossorigin
    />
    <title>Beat 4 Beat</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <script src="/src/index.tsx" type="module"></script>
  </body>
</html>
